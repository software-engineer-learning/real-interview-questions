name: Trigger site deploy

# Rebuilds swe.springlee.dev whenever real interview question content changes.
#
# This fires a GitHub repository_dispatch at software-engineer-learning/swe-site,
# which is what swe-site/.github/workflows/deploy.yml listens for. That workflow
# is the only thing that actually rebuilds the site: it runs build.sh, which
# clones all four content repos, runs scripts/prepare.sh and mkdocs build, then
# uploads the result to Cloudflare Pages with `wrangler pages deploy`.
#
# Do NOT swap this back to a Cloudflare Pages deploy hook. swe-site is a Direct
# Upload project, so a deploy hook has no repo to clone and no build command to
# run -- it re-serves the assets already uploaded, which looks like a successful
# deploy while the content stays stale. Deploy hooks only build on Git-connected
# Pages projects, and connecting this one would run the build twice.
#
# Set SITE_DISPATCH_TOKEN to a classic PAT with the 'repo' scope, owned by an
# account that can write to swe-site. An organisation-level secret covers every
# content repo at once, so the token is rotated in one place.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Fire the content-updated dispatch at swe-site
        env:
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "${SITE_DISPATCH_TOKEN}" ]; then
            echo "::error::SITE_DISPATCH_TOKEN is not set — swe-site will not rebuild."
            echo "Create a classic PAT with the 'repo' scope on an account that can write to"
            echo "software-engineer-learning/swe-site, then save it as an organisation secret"
            echo "named SITE_DISPATCH_TOKEN so every content repo picks it up at once."
            exit 1
          fi

          # No -f: it discards the response body, and GitHub explains a refusal there.
          resp="$(mktemp)"
          code="$(curl -sS -X POST \
            -o "$resp" -w '%{http_code}' \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${SITE_DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/software-engineer-learning/swe-site/dispatches \
            -d "{\"event_type\":\"content-updated\",\"client_payload\":{\"repo\":\"${GITHUB_REPOSITORY}\",\"sha\":\"${GITHUB_SHA}\"}}")"

          # A successful dispatch is 204 with an empty body.
          if [ "$code" = "204" ]; then
            echo "Dispatch accepted — swe-site is rebuilding."
            exit 0
          fi

          echo "GitHub returned HTTP $code"
          echo "--- response body ---"
          cat "$resp"; echo

          case "$code" in
            401)
              echo "::error::Token rejected (401). SITE_DISPATCH_TOKEN is expired, revoked or truncated — regenerate it and update the organisation secret." ;;
            403)
              echo "::error::Token refused (403). It lacks write access to swe-site. A classic PAT needs the 'repo' scope; a fine-grained PAT needs 'Contents: read and write' on swe-site AND the organisation must allow fine-grained tokens (Org settings -> Personal access tokens). If the org enforces SAML SSO, authorise the token for it." ;;
            404)
              echo "::error::Repository not found (404). GitHub returns 404 rather than 403 when the token cannot see swe-site at all — check the token's repository access." ;;
            422)
              echo "::error::Dispatch rejected (422). The payload was malformed, or swe-site's deploy.yml no longer listens for the 'content-updated' event type." ;;
            *)
              echo "::error::Dispatch failed with HTTP $code." ;;
          esac
          exit 1
