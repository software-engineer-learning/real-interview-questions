name: Trigger site deploy

# Rebuilds swe.springlee.dev whenever real interview question content changes.
#
# This calls a Cloudflare Pages deploy hook rather than firing a GitHub
# repository_dispatch. The hook is an unguessable URL that takes no auth header:
# possession of the URL is the authorisation. That removes the personal access
# token this workflow used to need -- swe-site belongs to the
# software-engineer-learning org, and a fine-grained PAT owned by a personal
# account can never write to an org repo however it is configured, which is why
# the old dispatch returned 403.
#
# Set the SITE_DEPLOY_HOOK secret to the full hook URL. An organisation-level
# secret covers every content repo at once, so the hook is rotated in one place.
# Create or regenerate it in the Cloudflare dashboard:
#   Workers & Pages -> swe-site -> Settings -> Builds & deployments -> Deploy hooks

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call the swe-site deploy hook
        env:
          SITE_DEPLOY_HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "${SITE_DEPLOY_HOOK}" ]; then
            echo "::error::SITE_DEPLOY_HOOK is not set — swe-site will not rebuild."
            echo "Create one in the Cloudflare dashboard: Workers & Pages -> swe-site ->"
            echo "Settings -> Builds & deployments -> Deploy hooks. Save the whole URL as"
            echo "the SITE_DEPLOY_HOOK secret; the URL itself is the credential."
            exit 1
          fi

          # No -f: it discards the response body, and Cloudflare reports the
          # reason for a failure there. The hook takes no auth header and no
          # payload, which is also why the URL must never be echoed.
          resp="$(mktemp)"
          code="$(curl -sS -X POST -o "$resp" -w '%{http_code}' "${SITE_DEPLOY_HOOK}")"

          if [ "$code" = "200" ] && grep -q '"success":[[:space:]]*true' "$resp"; then
            echo "Deploy hook accepted — swe-site is rebuilding."
            exit 0
          fi

          echo "Cloudflare returned HTTP $code"
          echo "--- response body ---"
          cat "$resp"; echo

          case "$code" in
            401|403)
              echo "::error::Deploy hook rejected ($code). The hook was probably deleted or regenerated in the Cloudflare dashboard — create a new one and update the SITE_DEPLOY_HOOK secret." ;;
            404)
              echo "::error::Deploy hook not found (404). The stored URL points at a hook that no longer exists, or the secret is truncated. Re-copy the full URL from Cloudflare." ;;
            *)
              echo "::error::Deploy hook call failed with HTTP $code." ;;
          esac
          exit 1
